<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L’Art du Savoir-Vivre</title>
<style>
:root{--bg:#fff8e8;--sf:#ffffff;--tx:#0a2463;--mu:#34457a;--ac:#c77d00;--ln:#f2d98a;--bt:#0a2463;--bx:#fff8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08153d;--sf:#0f2260;--tx:#fff3d1;--mu:#c3cdf0;--ac:#ffc933;--ln:#243a85;--bt:#ffc933;--bx:#08153d}}
:root[data-theme="dark"]{--bg:#08153d;--sf:#0f2260;--tx:#fff3d1;--mu:#c3cdf0;--ac:#ffc933;--ln:#243a85;--bt:#ffc933;--bx:#08153d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.2rem}
.logo{font-size:1.25rem;color:var(--tx);text-decoration:none}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:.2rem;flex-wrap:wrap}
nav a{display:block;padding:.35rem .6rem;color:var(--mu);text-decoration:none;font-size:.88rem;border-radius:6px}
nav a:hover,nav a.on{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
#burger{display:none;background:none;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:.4rem .7rem;font-size:1.1rem}
@media(max-width:960px){#burger{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--ln);padding:.5rem 1rem}nav.open{display:block}nav ul{flex-direction:column}nav a{font-size:1rem;padding:.6rem}}
main{max-width:760px;margin:auto;padding:2.5rem 1.2rem 3rem}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:.2em 0 .4em}
h2{font-size:1.5rem;margin:2rem 0 .6rem}
.num{color:var(--ac);font-family:Georgia,serif;font-size:1.1rem}
p{margin:0 0 1.1rem;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.lead{font-size:1.2rem;color:var(--mu)}
.key{background:var(--sf);border-left:4px solid var(--ac);padding:1rem 1.3rem;margin:2rem 0;border-radius:0 8px 8px 0}
.key h3{margin:0 0 .5rem;font-size:1.1rem}.key ul{margin:0;padding-left:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem;margin:1.5rem 0}
.card{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:1rem 1.1rem;color:var(--tx);text-decoration:none}
.card:hover{border-color:var(--ac)}.card b{font-family:Georgia,serif;display:block}.card span{color:var(--ac);font-size:.9rem}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.65rem 1.1rem;border-radius:8px;border:1px solid var(--ln);color:var(--tx);text-decoration:none;font-size:.95rem}
.btn:hover{border-color:var(--ac)}
.cta{background:var(--bt);color:var(--bx);border-color:var(--bt);font-weight:600}
footer{border-top:1px solid var(--ln);text-align:center;padding:2rem 1.2rem;color:var(--mu);font-size:.9rem}
footer .row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin:.8rem 0 1rem}
a:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{background:linear-gradient(135deg,#0a2463,#1e5bd8 55%,#7b2ff7);color:#f6f3ec;border-radius:18px;padding:2.6rem 1.6rem;margin-bottom:2rem;position:relative;overflow:hidden}.hero h1{color:#fff}.hero .num{color:#e6c26e}.hero .lead{color:#d9dff0;margin:0}.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:2px solid rgba(230,194,110,.5)}.hero::before{content:"";position:absolute;right:-20px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(230,194,110,.12)}.th{border-bottom:2px solid var(--ac);margin-bottom:1.6rem;padding-bottom:.8rem}.big{font-size:3.2rem;line-height:1.1}.txt p:first-child::first-letter{float:left;font:700 3.4rem/.9 Georgia,serif;color:var(--ac);padding:.3rem .5rem 0 0}.ico{font-style:normal;font-size:1.8rem;display:block;margin-bottom:.3rem}.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(20,33,61,.18)}.wa{background:#1faa59;border-color:#1faa59;color:#fff;font-weight:600}.wa:hover{background:#178a47}.key{box-shadow:0 4px 14px rgba(20,33,61,.08)}h2{border-left:4px solid var(--ac);padding-left:.7rem}

.thumb{width:100%;height:auto;border-radius:16px;display:block;margin-bottom:1.2rem;box-shadow:0 12px 30px rgba(10,36,99,.35)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details.acc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin:1.2rem 0;overflow:hidden;box-shadow:0 4px 14px rgba(10,36,99,.1)}
details.acc summary,nav .dd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
details.acc summary{padding:.9rem 1.1rem;font:700 1.2rem Georgia,serif;background:linear-gradient(90deg,#0a2463,#1e5bd8);color:#fff}
details.acc summary::-webkit-details-marker,nav .dd summary::-webkit-details-marker{display:none}
details.acc summary::after,nav .dd summary::after{content:"";width:.65rem;height:.65rem;border-right:3px solid #ffc933;border-bottom:3px solid #ffc933;transform:rotate(45deg);transition:transform .25s;margin-top:-.25rem;flex:none}
details[open]>summary::after{transform:rotate(-135deg);margin-top:.25rem}
details.acc .in{padding:1rem 1.2rem .3rem}
details.acc .in ul{padding-left:1.2rem;margin:0 0 1rem}
nav .dd summary{padding:.5rem .9rem;border-radius:8px;background:#0a2463;color:#fff;font-size:.95rem;font-weight:600}
nav .dd ul{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:.4rem;flex-direction:column;flex-wrap:nowrap}
@media(min-width:961px){nav{display:flex;gap:.6rem;align-items:center}nav .dd{position:relative}nav .dd ul{position:absolute;right:0;top:calc(100% + .5rem);min-width:290px;box-shadow:0 14px 30px rgba(10,36,99,.3)}}
@media(max-width:960px){nav .dd{margin-top:.4rem}nav .dd ul{margin-top:.4rem}}
.hero .lead{text-align:justify}
.obj{background:var(--sf);border-left:5px solid var(--ac);padding:1rem 1.2rem;border-radius:0 10px 10px 0;margin:1.2rem 0;box-shadow:0 4px 14px rgba(10,36,99,.1)}
.sch{background:#fff;border:1px solid #f2d98a;border-radius:12px;padding:14px;margin:1.2rem 0;text-align:center}.sch svg{width:100%;height:auto}.cap{font-size:.85rem;color:#555;margin-top:.5rem;font-style:italic}
.tw{overflow-x:auto;margin:1.2rem 0}table{width:100%;border-collapse:collapse;font-size:.95rem}th{background:#0a2463;color:#fff;text-align:left;padding:.7rem}td{padding:.7rem;border-bottom:1px solid var(--ln);vertical-align:top}tr:nth-child(even) td{background:rgba(242,217,138,.18)}
li{text-align:justify}
.fm{--navy:#102e4d;--navy2:#193f62;--gold:#c49a4b;--cream:#f7f4ed;--pale:#eef4fa;--ink:#20364c;--muted:#667889;--white:#fff;--shadow:0 12px 34px #12314c12}
.fm *{box-sizing:border-box}
.fm{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff;line-height:1.65}
.fm h1,.fm h2,.fm h3{font-family:Georgia,'Times New Roman',serif;line-height:1.12;color:var(--navy)}
.fm h1{font-size:clamp(2.5rem,6vw,5rem);margin:.3em 0 .25em}
.fm h2{font-size:clamp(1.8rem,3.4vw,2.8rem);margin:0 0 .6em}
.fm h3{font-size:1.3rem;margin:0 0 .4em}
.fm p{margin:.4em 0 1em}
.fm a{color:inherit}
.fm .container{width:min(1160px,92%);margin:auto}
.fm .nav{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #e9edf0}
.fm .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px}
.fm .brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--navy);font-family:Georgia,serif;font-size:1.1rem;font-weight:700}
.fm .brand-mark{font-size:1.7rem}
.fm .navlinks{display:flex;gap:24px;align-items:center}
.fm .navlinks a{text-decoration:none;font-size:.92rem;color:#314e68}
.fm .navlinks a:hover{color:var(--gold)}
.fm .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:99px;text-decoration:none;border:0;cursor:pointer;font-weight:700}
.fm .btn-gold{background:linear-gradient(135deg,#d5ad60,#b88b3c);color:white}
.fm .btn-dark{background:var(--navy);color:#fff}

.fm .hero .content{max-width:590px;padding:76px 0}
.fm .eyebrow{letter-spacing:.15em;text-transform:uppercase;font-size:.78rem;color:#e1b75f;font-weight:800}
.fm .hero h1{color:#fff}
.fm .hero p{max-width:520px;color:#f3f6f8;font-size:1.08rem}
.fm .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.fm .meta-strip{background:var(--cream);padding:24px 0}
.fm .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.fm .meta{display:flex;gap:12px;align-items:center;padding:12px;border-right:1px solid #dfd9ce}
.fm .meta:last-child{border:0}
.fm .meta .ico{font-size:1.55rem;color:var(--gold)}
.fm .meta strong{display:block;color:var(--navy)}
.fm .meta small{display:block;color:var(--muted)}
.fm section{padding:68px 0}
.fm .section-intro{max-width:720px;color:var(--muted)}
.fm .objective{background:#fff}
.fm .objectives{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:20px;margin-top:28px}
.fm .obj{padding:20px;border:1px solid #e7ebef;border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.fm .obj .icon{font-size:1.8rem;color:var(--gold)}
.fm .modules{background:linear-gradient(180,#f4f8fc,#fff)}
.fm .module{padding:44px 0;border-bottom:1px solid #e1e8ee}
.fm .module-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
.fm .pill{display:inline-block;border-radius:99px;background:var(--navy);color:#fff;padding:5px 14px;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:12px}
.fm .steps{list-style:none;padding:0;margin:24px 0}
.fm .steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;margin:17px 0}
.fm .num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:white;display:grid;place-items:center;font-weight:700}
.fm .steps p{font-size:.93rem;margin:3px 0;color:#516578}
.fm .gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm .photo{position:relative;overflow:hidden;border-radius:12px;min-height:210px;background:#e6edf2}
.fm .photo img{width:100%;height:100%;min-height:210px;object-fit:cover;display:block;transition:transform .4s}
.fm .photo:hover img{transform:scale(1.04)}
.fm .caption{position:absolute;bottom:0;left:0;right:0;padding:10px 13px;background:linear-gradient(transparent,#102e4ddd);color:#fff;font-weight:700;font-size:.84rem}
.fm .setting{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.fm .setting img{width:100%;border-radius:14px;box-shadow:var(--shadow)}
.fm table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:.9rem;box-shadow:var(--shadow)}
.fm th{background:var(--navy);color:#fff;text-align:left;padding:12px}
.fm td{padding:11px;border:1px solid #e1e9ef}
.fm tr:nth-child(even) td{background:#f8fbfd}
.fm .callout{padding:18px 20px;border-left:4px solid var(--gold);background:#fff9ec;border-radius:0 10px 10px 0;margin:22px 0}
.fm .accordion{border:1px solid #e2e9ef;border-radius:12px;background:#fff;margin:12px 0;overflow:hidden}
.fm .accordion button{width:100%;text-align:left;border:0;background:#fff;padding:18px 20px;color:var(--navy);font-weight:800;font-size:1rem;cursor:pointer;display:flex;justify-content:space-between}
.fm .accordion .answer{display:none;padding:0 20px 20px}
.fm .accordion.open .answer{display:block}
.fm .quiz{background:var(--cream)}
.fm .quiz-card{background:#fff;padding:26px;border-radius:16px;box-shadow:var(--shadow);max-width:800px}
.fm .q{padding:20px 0;border-bottom:1px solid #e7ebef}
.fm .q label{display:block;margin:8px 0;cursor:pointer}
.fm .quiz-result{margin-top:18px;font-weight:700}
.fm .cta{background:var(--navy);color:#fff;padding:48px 0}
.fm .cta h2{color:#fff}
.fm .cta-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.fm .cta p{color:#e2eaf1}
.fm .footer{background:#0b2238;color:#dce6ef;padding:28px 0}
.fm .footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

.fm .small{font-size:.85rem;color:#8293a3}
.fm .mobile-menu{display:none}

<section class="objective" id="fm-formation"><div class="container"><span class="eyebrow">Ce que vous apprendrez</span><h2>Objectifs de la formation</h2><p class="section-intro">Apprendre les règles n’est pas une question de rigidité : il s’agit de se sentir à l’aise, de respecter les autres et de savoir s’adapter à chaque situation.</p><div class="objectives"><div class="obj"><div class="icon">✦</div><h3>Gagner en confiance</h3><p>Aborder les repas formels et informels avec assurance et naturel.</p></div><div class="obj"><div class="icon">♧</div><h3>Adopter une attitude élégante</h3><p>Posture, gestes et comportements appropriés en société.</p></div><div class="obj"><div class="icon">♧</div><h3>S’adapter aux contextes</h3><p>Comprendre les codes familiaux, amicaux et professionnels.</p></div><div class="obj"><div class="icon">☆</div><h3>Faire bonne impression</h3><p>Communiquer respect, discrétion et considération.</p></div></div></div></section>
<section class="modules" id="fm-modules"><div class="container"><span class="eyebrow">Cours guidé</span><h2>Les modules de formation</h2><p class="section-intro">Explorez les leçons une à une. Les images accompagnent les notions et les encadrés mettent en évidence les règles essentielles.</p>
<div class="module"><div class="module-grid"><div><span class="pill">Module 1</span><h2>L’installation et la posture</h2><p>Bien se tenir à table constitue une première marque de respect envers ses hôtes et les autres convives. Une posture élégante démontre votre attention avant même le début du service.</p><ol class="steps"><li><span class="num">1</span><div><strong>Avant de s’asseoir</strong><p>Attendre que l’hôte invite les convives à prendre place. Si un plan de table est établi, le respecter.</p></div></li><li><span class="num">2</span><div><strong>La posture</strong><p>S’asseoir droit, sans s’appuyer lourdement ni s’affaler. Garder les pieds au sol et éviter les mouvements distrayants.</p></div></li><li><span class="num">3</span><div><strong>Les mains et les coudes</strong><p>Les poignets peuvent reposer délicatement près du rebord de table. Garder les coudes près du corps et éviter de les poser sur la table pendant qu’on mange.</p></div></li><li><span class="num">4</span><div><strong>La serviette</strong><p>Lorsque l’hôte déplie la sienne, déplier la serviette en deux et la poser sur les genoux. Ne jamais la nouer autour du cou.</p></div></li></ol></div><div class="gallery"><div class="photo"><img alt="Posture élégante à table" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAgMEBQYHCAEACf/EAFEQAAEDAwIDBAcFBgIGCAMJAAECAwQABREGIQcSMRNBUWEIFCIycYGRI0JSocEVJGJysdEzghY0kqKy4RclQ0RTc6PCVGPwCRgmJzdkg5Oz/8QAGwEAAgMBAQEAAAAAAAAAAAAAAwQAAQIFBgf/xAA0EQACAgEEAAUCBAYBBQEAAAAAAQIDEQQSITEFEyJBUTJhM3GR0RQjgaGx8EIGFVLh8cH/2gAMAwEAAhEDEQA/ANo3C1pWws43O9QZ1IhPqzsAasyZIaTHUCRVZ3xXauqCK8v4nXGHMT0Hh85SWJCdeoo6V9mVDPxrrl0ZcACVjJ86qjWMebBcVLZWQE9RRmh58m+ONqWVAA43rzcdVPdtY67YqWxrkue2ntADToEUnt0TsGBnrilvQGutXHEeQVksy4CFJxRZGKTz7oxEB51gYpCxf40tX <div class="module"><div class="module-grid"><div><span class="pill">Module 2</span><h2>Le dressage et l’usage des couverts</h2><p>Connaître la disposition d’un couvert formel permet d’aborder n’importe quel menu avec assurance. La règle fondamentale consiste à utiliser les couverts en partant de l’extérieur vers l’intérieur, au fil des plats.</p><div class="callout"><strong>Règle à retenir :</strong> les couverts du premier service sont généralement les plus éloignés de l’assiette. On progresse vers l’intérieur à mesure que les plats arrivent.</div><h3>Comment utiliser les couverts ?</h3><p>La fourchette se tient généralement à gauche, le couteau à droite, lame vers l’assiette. La cuillère à soupe se place habituellement à droite des couteaux. Les ustensiles à dessert peuvent se trouver au-dessus de l’assiette ou être apportés au service.</p></div><div class="setting"><img alt="Exemple de couvert formel" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAABgMEBQcBAggACf/EAFEQAAEDAwMBBQUEBgcEBwcFAQECAwQABREGEiExBxMiQVEUYXGBkRUyobEII0JSksEkM2JygqPRFqKyszRDU2N04fAlJlVkc8LxCRc1RYPi/8QAGwEAAgMBAQEAAAAAAAAAAAAAAwQAAQIFBgf/xAA0EQACAgEDAgUBCAICAgMAAAABAgADEQQSITFBBRMiUWFxFCMygZGhsdHB8ELhBvEzUoL/2gAMAwEAAhEDEQA/ABPtJfSvVupCUpOblJzwP+1VVZONJW8fCkD4Ci3tAuQ/231Q1nO26Sh/nKoPW8nfnNeR1dQViyyO25RHiENoRyhH8IrMVpL8lICE9f3RTVUgFOM08srwTJBPrSlaknmDr/EJZum7c2lCctoH+EUcw4zaQPCn6UE2mehptPIogZvSNuAqpcntPV6KxQuJNy+77sjan6CgXUPdBteUI6egqfeuSVNqO6gLUt1AChurVFBbkQmqvAWV9enUe0EBtH8Ipg2G+DsRn+6KTuMkPSVEHgUgl3A611kpGJ5ey0sxMJLdIaSQNiP4RRPGfaKAdqB8hVeR5JSoYohjS17BQ7KBG9NcRChcxscbUfQVoh1pauW0fwihtctaTk0rFnlToGaF5eI+Lt3WGkFpClAhCP4RRXBaSEDwJ+goUsq9+00ZxAAkUtYY9V0jjukbc7U/SmzqUj9hP8Ip6elN3kDaaEDDkQduiUlJ8Cf4RQPPSgOH9Wj+EUdXL7pFA1z4cNN0xO6QUxtsgkNo/hFC89pvn9Wj+EUVy <div class="module"><div class="module-grid"><div><span class="pill">Module 3</span><h2>La serviette, les verres et les accessoires</h2><p>La serviette protège les vêtements et permet d’essuyer discrètement les lèvres. Les verres sont disposés selon les boissons prévues au menu.</p><ul><li>Déposer la serviette sur les genoux dès le début du repas.</li><li>Utiliser la serviette avant de boire si les lèvres sont grasses.</li><li>Tenir les verres à pied par la tige lorsque c’est approprié.</li><li>Garder le téléphone et les objets personnels hors de la table.</li><li>Rompre le pain en petites portions, avec discrétion.</li></ul></div><div class="gallery"><div class="photo"><img alt="Verres à eau et vin" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAQIDBAUGBwgACf/EAE4QAAEDAwMCBAMEBgYGCQIHAAEAAgMEBRESITEGQQcTUWEUInEyQoGRFSNSobHRCBYzYpPBJENygpThJTQ1U2ODhJLwF/E2REVVc3Sy/8QAGgEAAgMBAQAAAAAAAAAAAAAAAAECAwQFBv/EADQRAAICAQMBBgQEBgMBAAAAAAABAgMRBBIhMQUTIkFRkRQyUmFCobHwFXGBwdHhBiPxM//aAAwDAQACEQMRAD8AbdG+IfiKIhLcOoL46Fw2fJUvP+aP1F4xdXUsr4mdUXZm22mqcMfvXS1d0LbxbfIZC1uBjGFzJ4zeHbbRTvuFMC0xnLm9iF4XU6W6N3ed48emWX2UuNXHUhafxR67ngLndY3wnPesf/NPLb4udaUshMvVF2kH9+qc7+JVAs8/mUWEJl0vcCsU77m5Rcn7s5ak0+Dorpjx2uEdK9txudRNL2c+Q5H71Xbt419Q11+00l8r4qYbCNk7gP4rEZpiN2uP5p9YJ2m4HXxjlQtsudWHNvH3Z0abXKOGjaepvF/qCG0O8q+V0cunZzZiD+eVSuhesPEbqS7gu6zvzKYO4Fa/B/eq/wBUyR1MccMZ3KvXhoY7SyAPA37paCdvd43vL9Wwk+8tSfRG01jOrYLR5repbo+QN5NS/P8AFYnXdY+JXxtRBF1JeAxp2/0hy3Gu6lhbbTuMYVetNTbquQve1hc47lKyx13Kuux5fq2bnVGeMnP9d4i+KNgrTNW9U3z4fPHxb8D96s1j8fupJZIm1HUNxeBzqqHHP71pPiX0zQ1tike1rMFpXFD6/wDRF1qKdztonkA57LrSostjhyeV6My3R7hpxOyrp463M20/D3esExbsRKRgrHr942dbRB5b1beGD+7VvH+ap/STKvrGubR0hOgfbf2aFo3UHgaG2kzEzOl05Bz3WfT02ws8cn7saVl63JGcUnjH4kVlZ8vW9/bFnYCuf/NaXYfF3rOmpj8R1XeZXE <div class="module"><div class="module-grid"><div><span class="pill">Module 4</span><h2>Les bonnes manières pendant le repas</h2><p>Les bonnes manières reposent sur des gestes simples qui rendent le repas agréable pour tous.</p><ul><li>Prendre de petites bouchées et mâcher bouche fermée.</li><li>Éviter de parler la bouche pleine.</li><li>Manger à un rythme modéré.</li><li>Ne pas faire de bruit avec les couverts ou la bouche.</li><li>Demander poliment qu’un plat soit passé plutôt que se pencher.</li><li>Servir des portions raisonnables et utiliser les ustensiles de service.</li></ul><div class="callout">Une maladresse peut arriver. L’élégance consiste à rester calme, s’excuser brièvement et régler la situation avec discrétion.</div></div><div class="photo"><img alt="Repas partagé avec présentation raffinée" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAgMEBQYHCAEACf/EAFEQAAEDAwIDBAcFBgIGCAMJAAECAwQABREGIQcSMRNBUWEIFCIycYGRI0JSocEVJGJysdEzghY0kqKy4RclQ0RTc6PCVGPwCRgmJzdkg5Oz/8QAGwEAAgMBAQEAAAAAAAAAAAAAAwQAAQIFBgf/xAA0EQACAgEEAAUCBAYBBQEAAAAAAQIDEQQSITEFEyJBUTJhM3GR0RQjgaGx8EIGFVLh8cH/2gAMAwEAAhEDEQA/ANo3C1pWws43O9QZ1IhPqzsAasyZIaTHUCRVZ3xXauqCK8v4nXGHMT0Hh85SWJCdeoo6V9mVDPxrrl0ZcACVjJ86qjWMebBcVLZWQE9RRmh58m+ONqWVAA43rzcdVPdtY67YqWxrkue2ntADToEUnt0TsGBnrilvQGutXHEeQVksy4CFJxRZGKTz7oxEB51gYpCxf40tXK2sE1iVkU8ZNRixyNFKFHA8wBHfQSKpmkwgiuYoxSd6DjFZwbyEPjKaaHBhRp5eHsGmhxPtmm9OuDE2FY9oVJbSnYVHUjJFSW1D2RT+lXrFdQ/SO/dQFUbigEV1kc4KruK6RXsVoyeFeNdFcNQgmfTtSZjZfwonUl9gaZss273WQI1vhN9o88QTyj4d5J2A7zWHOMHpE3TW3rVttTqrXp1R5ezCsOyQO9wjoD+EbeOaztyzTkork1NxB9IbRvDpS4r0s3K6IwFRIKgrs8499fup+G58qz7qX009SSnyizW232phQwntkmQ50G5JIA8tqyndLitGcub46DrvjfypuE5TZQkcoyAQc/pRkhZzyX4/6T3ElUkOL1MrIQEhJjshJ3Bzjl6+dSfTfpba0tjzTlxTbLiwVBS23GOyUpIGOULQcDxzg1lgz3 <div class="module"><div class="module-grid"><div><span class="pill">Module 5</span><h2>La conversation et le savoir-vivre social</h2><p>Un repas est aussi un moment d’échange. Une conversation agréable repose sur l’écoute, la curiosité et le respect des opinions.</p><ul><li>Parler clairement et à un volume raisonnable.</li><li>Ne pas monopoliser la conversation.</li><li>Écouter sans interrompre.</li><li>Privilégier les sujets ouverts et accessibles.</li><li>Éviter les plaisanteries humiliantes et les confidences imposées.</li><li>Complimenter avec sincérité, sans exagération.</li></ul></div><div class="photo"><img alt="Conversation chaleureuse pendant un dîner" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAABQIDBAYHAQgACf/EAE8QAAEDAwIDBQUEBgcFBwIHAAECAwQABRESIQYxQQcTIlFhFDJxgZEVQlKhCCMzYrHBJENygpKT0TRTY4PwFiVEc6Lh8RiyNUVUVWSEwv/EABsBAAIDAQEBAAAAAAAAAAAAAAIEAQMFAAYH/8QANxEAAgIBAwIEBAYBBAEFAQAAAQIAAxEEEiExQQUTIlEyYXGRFIGhsdHwIwZCweHxJDNSYnKS/9oADAMBAAIRAxEAPwDZu0jju42u6XliJdp0csyHEJ7p5SQnB6b1gI7XOOJ1+ZiMcWXk5XukS1cvrV+7Y5bbPEPEIVsoy3f/ALjXnHhC8+xcbpL6SltxWElQ9a+b6Wy66+5txwCe595t6hUAQY9p7g4d4ovotzJk3WatwjcreJNWRviC5Ot5Fwk/5hqkWeUxOt7KmlpJ0jkaOwCpC9J5VpGywjG4/ePIlY7CGZF7uncKxcZSSOodIqvq4ivjrmlq8TEqHTvjRpxCcYUNjQ72GIy93mo59a854hVqrHG2wgd/URNKjyQDlB9hDFsu940JS9cpLiupUuijt1nD/wAa/wD4zQiM4ke4M+tRp9xDRIB8XlWrRa9FOGcn8zFXqV34UfaIuPEd2VcGWGLnKQOulw0dl3qczESTPkasc+8NVCCypcwyHPlQri/ixuAgpKwAkUejvtRXtsY89OTB1FVeQqqOPlIfEvFvEUuc1Et99nsK1b928RV4hXq6xbcyZNxlLd0gEqdJJrxPx721q4b4pYeYc1Iz4gDW/wDZV2pweOoLbjjydhvk0wq3svmsSA3TkxEvSXKgDIh/jzibiCP3Ji8QXGICr+qfKc0e4e4vvblvZSu5zXV4/aOPEk1RO1F2HcVMojvboOfCaLWS+W5HD4R7ShLjaMZzuDWRSbV1bJ5hwPmYIWvcSRJfaVfr/B4fkSo/FFwjvBBP6l8px868RI7cO01MyRr4+4kLKVkJ/wC8HBtn40c7ae0y+G8rsyJwMFwElSTuR5VjE6cO70Ne8fKvWaKuwAtnh <div class="module"><div class="module-grid"><div><span class="pill">Module 6</span><h2>Les repas professionnels et les invitations</h2><p>Un repas professionnel permet de renforcer les relations et d’échanger dans un cadre moins formel. Il exige ponctualité, mesure et discrétion.</p><ul><li>Arriver à l’heure et prévenir en cas d’imprévu.</li><li>Choisir un menu facile à manger et adapté au contexte.</li><li>Garder son téléphone discret.</li><li>Éviter les familiarités excessives ou la flatterie.</li><li>Exprimer ses opinions avec assurance et tact.</li><li>Respecter les traditions et les habitudes de l’hôte.</li></ul></div><div class="photo"><img alt="Repas professionnel élégant" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAABgMEBQcIAgEJAP/EAEsQAAEDAwIEAwYDBQUGBAUFAQECAwQABREGIQcSMUETIlEIFDJhcYEjQpEVYqGxwRYzQ1KCJFNyktHhFyU0czVjorLxGDZEVNLw/8QAGwEAAgMBAQEAAAAAAAAAAAAAAwQBAgUABgf/xAA1EQACAgEDAgQEBQMEAwEAAAABAgADEQQSITFBBRMiUTJhcbEUgZGh8CPB0TNCUuEGFfFi/9oADAMBAAIRAxEAPwDGSWio0v7qcdKUj4Jp8OWsR7CDN5VzIJ5gpztTIt4NFC46Fg02Vb0ZJq6XjvOZJH2ltXvSdu9XdpWIVx0bVVlqhgSU1dek2gGEisPxq7K8TS8NT1SF1fAxEWQO1UReIZ95WcVpfVrKTCc+lUbOhpdkK+tT4HqCEOZHilOWxBGHEWVjANEUaE4Egmn8O1pSQcUYaW0+m+Xu320f/wAl1KDjsO9amp1g6zNrp2jJkPZWFAiiOfFJiE98VaHEThfF0pLYkWxhSYZSEuDqAr1+9BU1kGKQOwrzv49NQRZXNLTBXq3CUzd2CmRvTFLW3SiDUDPLJ+9RSUfKvTVWZQGZ7rhjHdnRh9P1qz7SnLSfpVcWtH4w+tWjY2uZpP0rK8QO6O6TiRl8bPhq9KA1oy4r61ZV/ZCWVfSq+CMvH61TQthDO1I9U7ixuZQ2rUXDb2f2b1pSHcZsfnemI8RIUPhSelZ4s9uVKlMNAbuLSgfc4r6w6QsEazadtkMNpyxHbb6dMJAqLdLbr7BRW+0dSR+0EdUNGvmFckz5mcbOFDmgLpGW22UxJYPKPRQqoHmiivpD7Yejmrlw+jXVlsByBLRzkD8qvL/Mivntc7eptStqPphbpydPecle/uOxlWddQvnIMZ7exg04rfeumwDSjkNeTtS8GC8+8hptJUtaglIHUk1ollAzmKgHMVacCAK/PTEIR1q9IHsu6imWpElSih9aObw+XYH0qkNX6TuWlbxJtVxZU1KYOCk9x2P0pHS63Tapylb5Ij <div class="module"><div class="module-grid"><div><span class="pill">Module 7</span><h2>Le dessert, la fin du repas et le départ</h2><p>Le savoir-vivre se poursuit jusqu’au dernier moment : dessert, café, remerciements et départ.</p><ul><li>Utiliser les couverts appropriés au dessert.</li><li>Accepter ou refuser poliment les boissons.</li><li>Poser les couverts côte à côte sur l’assiette lorsque l’on a terminé.</li><li>Déposer la serviette à côté de son assiette, sans la rouler en boule.</li><li>Remercier son hôte et saluer les convives avant de partir.</li></ul></div><div class="photo"><img alt="Dessert servi élégamment" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAGeAZ4DASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAgMEBQYHCAEACf/EAFEQAAEDAwIDBAcFBgIGCAMJAAECAwQABREGIQcSMRNBUWEIFCIycYGRI0JSocEVJGJysdEzghY0kqKy4RclQ0RTc6PCVGPwCRgmJzdkg5Oz/8QAGwEAAgMBAQEAAAAAAAAAAAAAAwQAAQIFBgf/xAA0EQACAgEEAAUCBAYBBQEAAAAAAQIDEQQSITEFEyJBUTJhM3GR0RQjgaGx8EIGFVLh8cH/2gAMAwEAAhEDEQA/ANo3C1pWws43O9QZ1IhPqzsAasyZIaTHUCRVZ3xXauqCK8v4nXGHMT0Hh85SWJCdeoo6V9mVDPxrrl0ZcACVjJ86qjWMebBcVLZWQE9RRmh58m+ONqWVAA43rzcdVPdtY67YqWxrkue2ntADToEUnt0TsGBnrilvQGutXHEeQVksy4CFJxRZGKTz7oxEB51gYpCxf40tXK2sE1iVkU8ZNRixyNFKFHA8wBHfQSKpmkwgiuYoxSd6DjFZwbyEPjKaaHBhRp5eHsGmhxPtmm9OuDE2FY9oVJbSnYVHUjJFSW1D2RT+lXrFdQ/SO/dQFUbigEV1kc4KruK6RXsVoyeFeNdFcNQgmfTtSZjZfwonUl9gaZss273WQI1vhN9o88QTyj4d5J2A7zWHOMHpE3TW3rVttTqrXp1R5ezCsOyQO9wjoD+EbeOaztyzTkork1NxB9IbRvDpS4r0s3K6IwFRIKgrs8499fup+G58qz7qX009SSnyizW232phQwntkmQ50G5JIA8tqyndLitGcub46DrvjfypuE5TZQkcoyAQc/pRkhZzyX4/6T3ElUkOL1MrIQEhJjshJ3Bzjl6+dSfTfpba0tjzTlxTbLiwVBS23GOyUpIGOULQcDxzg1lgz3EpIRIKir3gQCaKTMWxjs+UJUN0pVgHzqnEimz6O6T9LHRWpXUR7qH7DIUEgLkkOMFRwCAtO43P3gNt6u2HJZlstSI7zb0d1IW260oKQsHoQRsRXx+hzXkkhSVFsYwTv8utW9ws42X/AIdTOa2SwuKofaW6WSWXNhvgHYjxTg1iUcBYzyfTNpXSnFr3Kq <div class="module"><span class="pill">Module 9</span><h2>Situations pratiques</h2><p class="section-intro">Cliquez sur chaque situation pour réfléchir à la réponse la plus adaptée.</p><div class="accordion"><button type="button">1. Vous arrivez à un dîner : que faire avant de vous asseoir ? <span>＋</span></button><div class="answer"><p><strong>Bonne pratique :</strong> saluer les personnes présentes, attendre les indications de l’hôte et respecter le plan de table s’il existe.</p></div></div><div class="accordion"><button type="button">2. Un plat est hors de portée. Comment réagir ? <span>＋</span></button><div class="answer"><p><strong>Bonne pratique :</strong> demander poliment à la personne la plus proche de faire passer le plat.</p></div></div><div class="accordion"><button type="button">3. Vous renversez de l’eau sur la table. <span>＋</span></button><div class="answer"><p><strong>Bonne pratique :</strong> rester calme, présenter des excuses brèves et demander de l’aide pour nettoyer.</p></div></div><div class="accordion"><button type="button">4. Un convive exprime une opinion qui vous déplaît. <span>＋</span></button><div class="answer"><p><strong>Bonne pratique :</strong> écouter, exprimer votre désaccord avec tact et éviter de transformer le repas en confrontation.</p></div></div></div></div></section>
<section class="quiz" id="fm-quiz"><div class="container"><span class="eyebrow">Validation des acquis</span><h2>Quiz de fin de formation</h2><p class="section-intro">Répondez aux questions pour vérifier vos connaissances. Votre score s’affiche à la fin.</p><form class="quiz-card" id="quizForm"><div class="q"><strong>1. À table, quelle est la règle générale d’utilisation des couverts ?</strong><label><input type="radio" name="q1" value="a"> Du plus proche vers le plus éloigné</label><label><input type="radio" name="q1" value="b"> De l’extérieur vers l’intérieur</label><label><input type="radio" name="q1" value="c"> Selon son envie</label></div><div class="q"><strong>2. Comment manger en société ?</strong><label><input type="radio" name="q2" value="a"> Parler bouche pleine si le sujet est important</label><label><input type="radio" name="q2" value="b"> Mâcher bouche fermée, sans bruit excessif</label><label><input type="radio" name="q2" value="c"> Manger très vite</label></div><div class="q"><strong>3. Que faire lorsqu’un objet est hors de portée ?</strong><label><input type="radio" name="q3" value="a"> Se pencher au-dessus d’un convive</label><label><input type="radio" name="q3" value="b"> Demander poliment qu’on le passe</label><label><input type="radio" name="q3" value="c"> Se lever et déplacer les couverts</label></div><div class="q"><strong>4. Quelle attitude convient lors d’un repas professionnel ?</strong><label><input type="radio" name="q4" value="a"> Garder son téléphone discret et participer avec tact</label><label><input type="radio" name="q4" value="b"> Monopoliser la conversation</label><label><input type="radio" name="q4" value="c"> Parler uniquement de soi</label></div><div class="q"><strong>5. Quelle qualité résume le mieux le savoir-vivre à table ?</strong><label><input type="radio" name="q5" value="a"> L’ostentation</label><label><input type="radio" name="q5" value="b"> La rigidité</label><label><input type="radio" name="q5" value="c"> Le respect et la considération</label></div><button class="btn btn-gold" type="submit">Corriger mon quiz</button><div id="quizResult" class="quiz-result" aria-live="polite"></div></form></div></section>
<section class="cta" id="fm-contact"><div class="container cta-grid"><div><h2>Prêt à maîtriser l’art de la table ?</h2><p>Appliquez ces principes au quotidien et développez des compétences qui vous accompagneront dans votre vie personnelle et professionnelle.</p><a class="btn btn-gold" href="#formation" data-go="modules">Revoir les modules</a></div><div><h3 style="color:#fff">Une question ou un message ?</h3><p>Contactez-nous pour toute information concernant la formation.</p><a class="btn btn-gold" href="#" data-c="wa" target="_blank" rel="noopener">✆ Écrire sur WhatsApp</a><p style="margin-top:12px"><a href="#" data-c="em">✉ Envoyer un email</a></p></div></div></section></div></template>

var T=[
{id:"politesse",t:"La politesse",k:["Dire « bonjour », « merci », « s’il vous plaît »","Saluer en entrant et en quittant un lieu","Respecter les règles de courtoisie"],x:"La politesse constitue le fondement du savoir-vivre. Elle représente l’ensemble des comportements, des gestes et des expressions qui traduisent le respect envers autrui dans la vie quotidienne. Elle se manifeste à travers des mots simples tels que « bonjour », « merci », « s’il vous plaît », mais aussi par des attitudes comme céder sa place, saluer en entrant dans un lieu ou encore écouter attentivement son interlocuteur.|La politesse joue un rôle essentiel dans la construction des relations sociales. En effet, elle permet d’instaurer un climat de confiance et de respect mutuel. Une personne polie facilite les échanges, réduit les tensions et favorise une communication harmonieuse. À l’inverse, l’impolitesse peut engendrer des conflits, des malentendus et une détérioration des relations.|Il est important de souligner que la politesse varie selon les cultures et les contextes. Ce qui est considéré comme poli dans une société peut ne pas l’être dans une autre. Par conséquent, il est essentiel de s’adapter aux normes sociales du milieu dans lequel on évolue.|En milieu scolaire, la politesse est particulièrement importante. Elle favorise un climat propice à l’apprentissage et renforce le respect entre élèves et enseignants. Elle contribue également à développer des compétences sociales indispensables pour la vie professionnelle.|Enfin, la politesse ne doit pas être perçue comme une contrainte, mais plutôt comme une valeur essentielle qui reflète l’éducation et la personnalité d’un individu. Elle est un signe de maturité et de savoir-être."},
{id:"respect",t:"Le respect d’autrui",k:["Respecter les opinions, même différentes","Éviter les jugements ou insultes","Accepter les différences culturelles, sociales ou religieuses"],x:"Le respect d’autrui est une valeur fondamentale qui consiste à reconnaître la dignité, les droits et la valeur de chaque individu. Il implique l’acceptation des différences, qu’elles soient culturelles, sociales, religieuses ou personnelles.|Respecter autrui, c’est éviter les jugements hâtifs, les insultes et les comportements discriminatoires. C’est également faire preuve d’écoute, de tolérance et d’ouverture d’esprit. Dans une société diversifiée, le respect est indispensable pour maintenir la paix et la cohésion sociale.|Le respect se manifeste aussi dans les interactions quotidiennes : écouter sans interrompre, accepter les opinions différentes, et traiter les autres avec équité. Il contribue à créer un environnement sain où chacun se sent valorisé et en sécurité.|Dans le cadre scolaire, le respect d’autrui est essentiel pour le bon fonctionnement de la classe. Il permet d’éviter les conflits, de favoriser la collaboration et de créer un climat d’apprentissage positif.|Le respect d’autrui est également lié à l’estime de soi. Une personne qui se respecte elle-même est plus encline à respecter les autres. Ainsi, cette valeur doit être inculquée dès le plus jeune âge.|En somme, le respect d’autrui est une condition indispensable pour vivre en harmonie dans une société."},
{id:"maitrise",t:"La maîtrise de soi",k:["Ne pas se mettre en colère facilement","Éviter les comportements agressifs","Garder son calme dans les situations difficiles"],x:"La maîtrise de soi est la capacité à contrôler ses émotions, ses impulsions et ses réactions face aux différentes situations de la vie. Elle permet d’agir de manière réfléchie plutôt que sous l’effet de la colère, du stress ou de la frustration.|Dans la vie quotidienne, de nombreuses situations peuvent provoquer des réactions émotionnelles fortes. Une personne qui possède une bonne maîtrise de soi sait garder son calme, analyser la situation et répondre de manière appropriée.|Cette compétence est particulièrement importante dans les relations sociales. Elle permet d’éviter les conflits, de résoudre les problèmes de manière pacifique et de maintenir des relations équilibrées.|La maîtrise de soi est également essentielle dans le milieu scolaire et professionnel. Elle favorise la concentration, la discipline et la prise de décisions réfléchies. Elle contribue également à renforcer la crédibilité et le respect envers une personne.|Développer la maîtrise de soi demande un travail personnel. Cela implique de prendre conscience de ses émotions, d’apprendre à les gérer et de développer des stratégies pour rester calme dans les situations difficiles.|En conclusion, la maîtrise de soi est une qualité indispensable pour réussir dans la vie et maintenir des relations harmonieuses avec les autres."},
{id:"tenue",t:"La tenue et la présentation",k:["S’habiller de manière appropriée selon le contexte","Avoir une posture correcte","Soigner son hygiène personnelle"],x:"La tenue et la présentation font partie intégrante du savoir-vivre. Elles reflètent l’image que l’on donne de soi aux autres et influencent la manière dont on est perçu.|Une tenue appropriée dépend du contexte : scolaire, professionnel ou social. Il est important de s’habiller de manière correcte, propre et adaptée à la situation. Une bonne présentation inclut également l’hygiène personnelle, la posture et l’attitude.|L’apparence extérieure joue un rôle important dans les premières impressions. Une personne soignée inspire généralement confiance, respect et sérieux. Cela est particulièrement important dans les milieux professionnels où l’image personnelle peut influencer les opportunités.|Cependant, il ne s’agit pas seulement de vêtements, mais aussi de comportement. Une bonne posture, un regard attentif et une attitude respectueuse contribuent à une présentation positive.|Dans le cadre éducatif, enseigner la tenue et la présentation permet aux élèves de comprendre l’importance de leur image et de développer leur confiance en eux.|Ainsi, la tenue et la présentation ne sont pas superficielles, mais constituent un élément essentiel du savoir-vivre."},
{id:"langage",t:"Le langage et la communication",k:["Utiliser un langage correct et respectueux","Éviter les mots vulgaires ou blessants","Savoir écouter les autres sans interrompre"],x:"Le langage et la communication sont des outils essentiels dans les relations humaines. Ils permettent d’exprimer ses idées, ses émotions et ses besoins, tout en facilitant la compréhension mutuelle.|Une bonne communication repose sur plusieurs éléments : un langage clair, un ton respectueux et une écoute active. Il est important d’éviter les propos blessants, les insultes et les interruptions.|Le choix des mots est crucial. Un langage adapté au contexte et à l’interlocuteur favorise des échanges efficaces et respectueux. Par exemple, le langage utilisé en classe ne sera pas le même que celui utilisé entre amis.|L’écoute active est également une composante essentielle de la communication. Elle consiste à prêter attention à l’autre, à comprendre son message et à répondre de manière appropriée.|Une communication efficace permet de prévenir les conflits, de renforcer les relations et de favoriser la collaboration.|Dans le milieu scolaire, elle facilite l’apprentissage et améliore les relations entre enseignants et élèves.|En résumé, le langage et la communication sont au cœur du savoir-vivre et jouent un rôle déterminant dans la qualité des relations humaines."},
{id:"courtoisie",t:"La courtoisie et la bienveillance",k:["Aider les autres","Faire preuve de gentillesse","Être attentif aux besoins des autres"],x:"La courtoisie et la bienveillance vont au-delà de la simple politesse. Elles traduisent une attitude positive et respectueuse envers les autres.|La courtoisie se manifeste par des gestes d’attention, de respect et de gentillesse. Elle consiste à être agréable dans ses relations et à adopter un comportement respectueux en toutes circonstances.|La bienveillance, quant à elle, implique de vouloir le bien des autres. Elle se traduit par des actions positives, comme aider quelqu’un en difficulté, encourager ou soutenir.|Ces qualités renforcent les relations sociales et créent un climat de confiance. Elles favorisent également le bien-être collectif.|Dans un environnement scolaire, la bienveillance est essentielle pour encourager les élèves, renforcer leur confiance en eux et améliorer leur réussite.|En conclusion, la courtoisie et la bienveillance sont des valeurs essentielles pour construire une société harmonieuse."},
{id:"regles",t:"Le respect des règles sociales",k:["Respecter les lois et règlements","Être ponctuel","Respecter les espaces publics (propreté, silence, etc.)"],x:"Le respect des règles sociales est indispensable pour le bon fonctionnement de la société. Ces règles définissent les comportements acceptables et permettent d’assurer l’ordre et la sécurité.|Elles incluent le respect des lois, la ponctualité, le respect des espaces publics et des normes de comportement. Par exemple, ne pas faire de bruit dans un lieu public ou respecter les files d’attente.|Respecter ces règles montre une prise de responsabilité et une volonté de vivre en harmonie avec les autres.|Dans le cadre scolaire, le respect des règles est essentiel pour maintenir la discipline et favoriser un environnement propice à l’apprentissage.|Le non-respect des règles peut entraîner des conflits, des sanctions et un désordre social.|Ainsi, le respect des règles sociales est une condition essentielle pour une vie collective équilibrée."},
{id:"emotions",t:"L’intelligence émotionnelle",k:[],x:"L’intelligence émotionnelle est la capacité à reconnaître, comprendre et gérer ses émotions ainsi que celles des autres.|Elle joue un rôle clé dans les relations humaines. Une personne dotée d’une bonne intelligence émotionnelle est capable de faire preuve d’empathie, de comprendre les sentiments des autres et d’adapter son comportement.|Elle permet également de mieux gérer le stress, les conflits et les situations difficiles.|Dans le milieu scolaire et professionnel, l’intelligence émotionnelle favorise la coopération, la communication et la résolution des problèmes.|Elle contribue également au développement personnel et à l’épanouissement individuel.|En conclusion, l’intelligence émotionnelle est une compétence essentielle pour vivre en harmonie avec les autres et réussir dans la vie."}
];

'<details class="acc" open><summary>Conclusion</summary><div class="in"><p>Le savoir-vivre est une compétence sociale essentielle qui permet de vivre en paix avec les autres. Il s’apprend dès le plus jeune âge et se développe tout au long de la vie. Une personne qui possède un bon savoir-vivre contribue à créer une société plus respectueuse et harmonieuse.</p></div></details><p><a class="btn cta" href="#politesse">Commencer par la politesse</a></p></div>';}
